services:
  - type: web
    name: dns-query-analysis-tool
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_SECRET_KEY
        generateValue: true
